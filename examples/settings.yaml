# Copy to data/settings.yaml and edit.
#
# Was der Betrieb braucht: Quellen, Kadenz, Budgets, Schwellwerte. Womit die
# Datenbank einmalig befuellt wird, steht in seed.yaml; wonach geurteilt wird,
# in docs/leseprofil.yaml (ADR 21).
slug: default
name: Meine Leseliste

# Deal thresholds in cents (see CONTEXT.md).
strong_deal_max_cents: 500   # unter 5,00 € = Strong Deal, ohne Rabatt-Check
deal_max_cents: 1000         # 5,00-9,99 € nur mit echtem Rabatt
min_discount_pct: 25

# Wie viele Urteile das Bewertungstor pro Lauf höchstens einholt (ADR 19).
# Der erste Lauf mit einem ANTHROPIC_API_KEY trifft den ganzen Rückstand; er
# arbeitet ihn über mehrere Läufe ab. Was übrig bleibt, gilt als unbewertet
# und wird gezeigt.
# Wieviele Bücher in einen Modellaufruf gehen. Ein Bündel spart den Großteil
# des Prompts — aber ein Modell, das zwanzig Dinge in einer Antwort beurteilt,
# ankert aneinander. Kleiner setzen, um das zu messen.
rating_batch_size: 20
# Welches Modell urteilt. Leer lassen für die Voreinstellung.
rating_model:
rating_budget: 40

# Wie viele Stunden zwischen zwei Rundgängen mindestens liegen. Geprüft wird
# gegen das Journal, nicht gegen eine Uhr: ein Wirt darf öfter rufen, der Lauf
# entscheidet. Die Grenze gilt nur automatischen Auslösern — der Knopf „Lauf
# jetzt starten" und ein getipptes `ebw` laufen sofort.
#
# Zwanzig und nicht vierundzwanzig, damit sich der tägliche Lauf nicht um die
# eigene Dauer nach hinten schiebt, bis ein Tag ausfällt.
run_every_hours: 20

# Wie viele Zeilen die Startseite je Abschnitt zeigt: oben die Angebote aus
# der Watchlist, darunter die offenen Entscheidungen. Der Rest haengt am
# Verweis daneben. Das haengt an deinem Bildschirm, nicht am Werkzeug.
home_offers: 5
home_suggestions: 3

# Der Wochentag des breiteren Durchgangs.
extended_sweep_weekday: 6  # 0 = Monday

# Sprachen, in denen Funde in Frage kommen — Codes, wie die DNB sie liefert
# (ISO 639-2): ger, eng, fre, ... Was die DNB ausdruecklich in einer anderen
# fuehrt, kommt nicht in den Stapel und kostet kein Urteil. Unbekannt gilt
# nie als fremd, und Watchlist-Titel sind ausgenommen.
languages: [ger]

# Appended to the outgoing User-Agent so a site operator can reach you.
# Optional, and nothing personal is sent unless you fill it in yourself.
# contact: mailto:du@example.org

sources:
  onleihe:
    # Which formats to watch. The Onleihe lists the ebook and the audiobook of a
    # novel as two separate titles, so without a preference neither can win.
    media: [ebook]
  # Die zweite Plattform desselben Verbunds, mit eigenem Bestand: was die
  # Onleihe nicht führt, steht hier mitunter sehr wohl. Nur deutsche
  # EPUB-E-Books, keine Optionen.
  overdrive:
  beam:
  # Eine zweite Quelle derselben Bauart braucht einen eigenen Namen: sonst
  # hieße sie wie ihre Nachbarin, und die Oberfläche könnte beide nicht
  # auseinanderhalten. Wie die Bibliothek heißt, hängt an der Installation —
  # das Werkzeug kennt nur die Namen der Plattformen, die es unterstützt (#14).
  # voebb:
  #   kind: onleihe
  #   name: VÖBB
  # A canned source for trying the pipeline out without touching the network.
  # fake:
  #   fixture: fake-source.yaml
