<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Das Zeichen der Anwendung ist genau das, was eine Zeile der Liste zeigt,
    wenn zu einem Buch noch kein Cover geholt wurde und der Shop es gerade
    guenstig fuehrt: der gezeichnete Ruecken aus `_cover.html` mit dem
    Schnaeppchen-Abzeichen an der Ecke. Nicht aehnlich, sondern dieselben
    Zahlen — Rechteck 44x64 mit rx 2, Ruecken 5 breit, drei Zeilen bei y 16,
    21 und 40; Abzeichen 20 Durchmesser, 4 ueber die obere und rechte Kante
    hinaus, Ring 2 breit, Symbol 12 mit Strichstaerke 2,4.

    Die Farben (28.10.2026) folgen den Stimmungsbildern und A2′: der Deckel
    im Petrol der Bilder (#2E6B68), das Abzeichen im Preis-Orange, der Ring im
    Papier. Vorher stand hier das kühle Türkis der Liste, 174 — derselbe Ton wie `color-accent`.

    Umgerechnet wird ueber eine Gruppe: die Zeile misst mit dem Abzeichen
    50 x 70, das Zeichen ist 32 x 32, also Faktor 32/70 = 0,457 und die
    Breite (22,86) mittig gesetzt.

    Bewusst in Kauf genommen: das Preisschild ist hier ein Umriss wie in der
    Liste, kein gefuelltes Schild. Bei 40 Pixeln in der Kopfzeile traegt das;
    im Tab bei 16 Pixeln ist die Linie nur noch 0,27 Pixel breit und damit
    blass. Genauigkeit vor Lesbarkeit im Kleinsten — so war es gewuenscht.
  -->
  <style>
    .deckel { fill: #2E6B68 }
    .ruecken{ fill: #24504E }
    .zeile1 { fill: #9DBDB8 }
    .zeile2 { fill: #86ACA7 }
    .zeile3 { fill: #6F9A95 }
    .ring   { fill: #F6EFE5 }
    .marke  { fill: #BA480D }
    .schild { stroke: #F6EFE5 }
    @media (prefers-color-scheme: dark) {
      .ring   { fill: #05191E }
      .marke  { fill: #F8935D }
      .schild { stroke: #05191E }
    }
  </style>

  <g transform="translate(4.57 0) scale(0.457) translate(0 6)">
    <!-- Der Ruecken, wie ihn `_cover.html` zeichnet. -->
    <rect class="deckel" width="44" height="64" rx="2"/>
    <rect class="ruecken" width="5" height="64"/>
    <rect class="zeile1" x="12" y="16" width="22" height="1.5" rx="0.75"/>
    <rect class="zeile2" x="12" y="21" width="16" height="1.5" rx="0.75"/>
    <rect class="zeile3" x="12" y="40" width="12" height="1.5" rx="0.75"/>

    <!-- Das Abzeichen: Mitte (38, 6), Ring 2 breit in der Seitenfarbe. -->
    <circle class="ring" cx="38" cy="6" r="12"/>
    <circle class="marke" cx="38" cy="6" r="10"/>
    <!-- `ic-tag`, 12 gross, mit dem Ausgleich von 0,52 aus `.badge svg.zipfel`. -->
    <g transform="translate(38.52 6.52) scale(0.5) translate(-12 -12)"
       class="schild" fill="none" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11V4a1 1 0 0 1 1-1h7l9 9-8 8z"/>
      <circle cx="7.5" cy="7.5" r="1.3"/>
    </g>
  </g>
</svg>
