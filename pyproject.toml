[project]
name = "ebook-watchlist"
version = "0.1.0"
description = "Watches library availability and shop prices for a personal ebook watchlist"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "filelock>=3.13",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=0.28",
    "ruff>=0.6",
    "pytailwindcss>=0.3.1",
    "pytest-xdist>=3.8.0",
    "basedpyright>=1.40.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebook_watchlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto verteilt auf alle Kerne (Ticket 18).
addopts = "-m 'not live' -n auto"
markers = [
    "live: hits a real source over the network; excluded by default",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
# Typprüfung im CI (#106): Modus "standard"; was heute schon gemeldet wird,
# steht in .basedpyright/baseline.json, und nur neue Meldungen schlagen fehl.
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
