# Leseprofil — was mich an einem Buch trägt.
#
# Diese Datei geht vollständig in den Prompt des Bewerters. Was hier nicht
# steht, weiß er nicht; was hier steht, liest er als meinen Geschmack.
#
# Die Reihenfolge unter "achsen" IST die Gewichtung: was oben steht, wiegt
# schwerer. Umsortieren heißt umgewichten.
#
# "belegbar_aus" sagt, woraus ein Abschnitt sich überhaupt beurteilen lässt.
# Erlaubt sind die Angaben, die eine Beobachtung mitbringt — titel, untertitel,
# autor, reihe, thema, preis, klappentext — sowie "recherche" für alles, was
# nur ein Nachschlagen liefert. Steht dort "recherche" und kann der Bewerter
# nicht nachschlagen, dann ruht sein Urteil zu diesem Abschnitt auf Ableitung.

version: 4

einleitung: >
  Das Genre entscheidet nicht — es sagt nur, wo das Folgende erfahrungsgemäß
  vorkommt. Was ein Buch trägt, steht unter "achsen", in der Reihenfolge, in
  der es wiegt.

achsen:

  - name: Die Figur trägt alles
    belegbar_aus: [klappentext, recherche]
    text: |
      Das Wichtigste, und wenn nur eines zutrifft, dann bitte dieses.

      Ich brauche eine Hauptfigur mit einer Bruchstelle oder einer Eigenheit,
      durch die der ganze Text gefärbt ist: eine Sucht, eine Schuld, ein
      Verlust, eine Verdrahtung, die sie von allen anderen trennt. Kaputte,
      zynische Anti-Helden. Sture Ermittler am Limit. Gesetzlose mit Ecken und
      Kanten. Hartgesottene Überlebende. Die Beschädigung muss die Erzählung
      prägen, nicht bloß in einem Nebensatz vorkommen.

      Keine glattgebügelten, kompetenten Helden, die eine Aufgabe abarbeiten.

      Schwächer wird es, wenn mehrere gleichrangige Erzählperspektiven
      nebeneinander stehen, wenn auktoriale Distanz herrscht, oder wenn die
      Hauptfigur keine erkennbare Bruchstelle hat. Ein Ensemble ist kein Ersatz
      für eine Stimme.

      Ob die Figur über mehrere Bände wiederkehrt, ist dabei gleichgültig. Ein
      Einzelband kann diese Achse genauso tragen wie eine Reihe.

  - name: Tempo
    belegbar_aus: [klappentext, recherche]
    text: |
      Der Einstieg muss rasant und kompromisslos sein, die Handlung muss
      vorwärtsdrängen. Langatmige Erklärungen und zähe Theoriepassagen
      verlieren mich, auch wenn alles andere passt.

      Ein Buch darf langsam brennen — es darf sich Zeit nehmen, Druck
      aufzubauen. Aber es darf nicht auf der Stelle treten. Der Unterschied
      ist, ob sich etwas zusammenzieht oder ob nur erklärt wird.

  - name: Düster, dreckig, kompromisslos
    belegbar_aus: [klappentext, thema]
    text: |
      Beklemmend und plotgetrieben. Die harte Jagd ohne juristisches
      Geplänkel. Schmutziger Cyberpunk. Dystopische Zukunft. Grimdark, in dem
      niemand strahlt. Gewalt und Schmutz dürfen deutlich sein; Trost und
      Versöhnung müssen es nicht.

      Das ist nicht dasselbe wie Tempo. Ein Buch kann düster sein und mich
      trotzdem am Erzähltempo verlieren, und ein schnelles Buch kann mir zu
      freundlich sein. Beides muss stimmen.

  - name: Katz und Maus
    belegbar_aus: [klappentext]
    text: |
      Ein psychologisches Duell oder eine Jagd mit tödlichem Einsatz, bei der
      BEIDE SEITEN HANDELN. Profiler gegen Täter. Gejagte gegen Apparat. Zwei
      Menschen und eine Frist.

      Nicht dasselbe: eine Ermittlung, in der nur eine Seite agiert und die
      andere Spuren hinterlässt.

  - name: Große Welten, wenn sie die Handlung nicht ausbremsen
    belegbar_aus: [klappentext]
    text: |
      Immersive, tiefgründige Welten und gigantische Konzepte ziehen mich an:
      verfallende Universen, dystopische Kastensysteme, digitale
      Parallelwelten. Die Bedingung ist, dass die Welt ERZÄHLT STATT ERKLÄRT
      wird — sie muss sich aus der Handlung ergeben und darf die Spannung nie
      anhalten.

      Umfang und Ehrgeiz einer Welt sind kein Nachteil. Ein Kapitel, das
      stehenbleibt, um sie zu erläutern, schon.

  - name: Enge
    belegbar_aus: [klappentext]
    text: |
      Zweitrangig, aber es hilft: ein einsames Raumschiff, ein abgeriegelter
      Tatort, eine geschlossene Anstalt, eine Insel, ein Bunker. Die Enge muss
      die Handlung erzwingen, nicht bloß Kulisse sein.

genres:

  belegbar_aus: [thema, klappentext]

  # Zweitrangig: die Achsen entscheiden. Ein Buch aus einem passenden Genre,
  # das keine Achse trägt, ist trotzdem nichts für mich.
  passt:
    - Psychothriller
    - Thriller allgemein, auch Cop-Noir und apokalyptischer Thriller
    - Krimi mit schwarzem Humor
    - Science-Fiction, besonders Space Horror und Military SF
    - Space Opera
    - Cyberpunk
    - Dystopie und Postapokalypse
    - Grimdark-Fantasy
    - Spionage

  # Gegenanzeigen: ziehen auf null, gleichgültig wie viel sonst stimmt.
  passt_nicht:
    - Cozy-Krimi
    - Erotik
    - >-
      Young Adult, wenn das Buch auch so erzählt: Jugendliche und ihr
      Erwachsenwerden stehen im Mittelpunkt, die Härte ist weichgezeichnet.
      Das Etikett allein reicht nicht — Händler vergeben es auch an Dystopien,
      die nichts davon tragen.

einstieg:
  belegbar_aus: [reihe, titel, untertitel, recherche]
  text: |
    Ich fange nicht mitten in einer Reihe an. In Frage kommen:

    - abgeschlossene Einzelbände — jederzeit;
    - Reihen von Autor:innen, die ich ausdrücklich mag — dort kenne ich den
      Stand und kann einordnen, wo ein Band hingehört.

    Band 5 einer Reihe, die ich nicht verfolge, ist kein Angebot an mich, so gut
    das Buch für sich sein mag.
