# Bewertungsschema — wie ein Buch gegen ein Leseprofil gehalten wird.
#
# Das VERFAHREN, nicht der Inhalt. Was jemand mag, steht im Leseprofil; hier
# steht nur, wie man ein Buch dagegen hält. Für eine andere Leserin mit einem
# anderen Profil bliebe diese Datei unverändert brauchbar — kommt hier ein
# Begriff aus einem bestimmten Geschmack vor, ist das ein Fehler.
#
# Nicht versioniert: eine Änderung hier entwertet keine gespeicherte Bewertung.
# Nur eine Änderung am Leseprofil tut das (ADR 21).
#
# Die Werte unter "sterne" und "confidence" liest auch der Code. Sie stehen
# hier einmal und nicht noch einmal in Python.

# Was in den Prompt geht. Alles andere in dieser Datei erklärt das Verfahren
# für Menschen und hat beim Bewerter nichts verloren — die Gegenprobe etwa
# betrifft die Pflege des Profils, nicht das Urteil über ein Buch.
fuer_den_bewerter:
  - was_bewertet_wird
  - sterne
  - confidence
  - begruendung
  - achsen
  - pitch
  - nichts_erfinden

was_bewertet_wird: |
  Die Passung zum Profil, nicht die Qualität des Buches. Ein hervorragender
  Roman, der nichts von dem trägt, was das Profil verlangt, bekommt wenige
  Sterne; das ist kein Urteil über das Buch, sondern über die Passung.

  Es gibt EINE Skala, gleichgültig wer urteilt.

sterne:
  von: 0
  bis: 5

  # Das Profil benennt selbst, was ihm am wichtigsten ist. Diese Tabelle
  # spricht deshalb vom "Kern" des Profils und nicht von einer festen Liste
  # von Kriterien — welche das sind und wie sie wiegen, entscheidet das Profil.
  bedeutung:
    5: Trifft den Kern des Profils, und keine wesentliche Erwartung wird verfehlt.
    4: Trifft den Kern, mit EINER klar benennbaren Lücke.
    3: Trifft eine Sache überzeugend, sonst nur Genre-Nähe.
    2: Nur Genre-Nähe. Nichts, was das Profil ausdrücklich verlangt.
    1: Kaum Berührung mit dem Profil.
    0: Eine Gegenanzeige des Profils greift.

  regeln: |
    Eine Gegenanzeige schlägt alles. Sie zieht auf null, gleichgültig wie viel
    sonst passt. Sonst ist sie keine.

    Vier ist kein Trostpreis. Der Unterschied zwischen fünf und vier ist eine
    Lücke, die sich BENENNEN lässt. Findet sich keine, sind es fünf.

    Wenn eine Bewertung keine Bücher unter vier Sternen kennt, unterscheidet
    sie nicht mehr, sondern bestätigt nur. Das ist ein Befund über das
    Verfahren, nicht über die Bücher.

confidence:

  # Reihenfolge ist Stärke: das Erste ruht am festesten.
  werte:
    - wert: belegt
      bedeutung: Alles, was das Urteil trägt, ist aus Daten oder geprüfter Quelle nachgewiesen.
    - wert: teils
      bedeutung: Mindestens eines ist erschlossen — die Begründung sagt, welches.
    - wert: vermutet
      bedeutung: Ruht überwiegend auf Ableitung.

  # Ab welcher Stärke ein Urteil ein Buch aus dem Digest nehmen darf.
  darf_zurueckhalten_ab: teils

  text: |
    Manches, was ein Profil verlangt, steht in keinen Metadaten und oft nicht
    einmal im Klappentext; dass er dazu schweigt, beweist nichts. Deshalb trägt
    jedes Urteil mit, worauf es ruht.

    "vermutet" heißt NICHT "ich habe nicht nachgesehen". Es heißt "ich habe
    nachgesehen und es steht nirgends".

    WAS "BELEGT" BRAUCHT: die Leseprobe. Klappentext und Schlagwörter sind
    Werbung — sie versprechen eine kaputte Hauptfigur und ein Tempo, das das
    Buch vielleicht nicht hat. Nur der Text selbst zeigt, wer erzählt, wie der
    Einstieg zieht und wie dreckig der Ton ist. Ohne Leseprobe ist "teils" das
    Höchste; wer trotzdem "belegt" schreibt, wird herabgestuft. Und auch mit
    Probe belegt sie nur, was ein Anfang zeigen kann: das Tempo des ganzen
    Buchs, ein Duell, das erst später beginnt, oder das Ende zeigt sie nicht.
    Wo das Urteil sich auf die Probe stützt, sagt die Begründung es.

    Das Profil nennt zu jedem Abschnitt, woraus er sich belegen lässt. Liegt
    keine dieser Angaben vor, sage das ausdrücklich und rechne den Abschnitt
    nicht ein.

    WAS EIN VERMUTETES URTEIL DARF: ein Buch durchlassen und einordnen, ja. Ein
    Buch zurückhalten, nein. Der Grund ist eine Asymmetrie — ein zu Unrecht
    gezeigtes Buch kostet eine Zeile, die die Leserin überspringt; ein zu
    Unrecht verschwiegenes ist unsichtbar, sie erfährt nie davon und kann den
    Fehler nicht bemerken. Wo geraten werden muss, wird zugunsten des Zeigens
    geraten.

    WANN RECHERCHIERT WERDEN MUSS: wer recherchieren kann, muss es. Ein Mensch
    mit einer Websuche schlägt nach, bis mindestens "teils" erreicht ist; dort
    ist "vermutet" ein Fehler und keine Auskunft. Ein automatischer Lauf kann
    das nicht — bei hundert Funden kann er nicht hundertmal nachschlagen. Für
    ihn ist "vermutet" zulässig, und die Regel darüber sagt, was daraus folgen
    darf.

gegenprobe: |
  Ein Profil, das nur aus Zustimmung gebaut ist, weiß nicht, wo seine Grenze
  verläuft. Wird alles zwischen drei und fünf Sternen bewertet, bestätigt die
  Skala nur.

  Deshalb gehören Bücher, die ENTTÄUSCHT haben, ebenso ins Profil wie die
  gemochten — jeweils mit dem Grund. Am wertvollsten ist dabei nicht das Buch,
  das ohnehin an einer Gegenanzeige scheitert, sondern eines, das auf dem
  Papier perfekt passte und trotzdem verloren hat. Genau das trennt ein Profil
  von einem Genre-Filter.

  Und die Richtung der Schlussfolgerung steht fest: ein gemochtes Buch, das
  schlecht bewertet wird, ist ein Befund über das Profil — nicht über das Buch.
  Ein Widerspruch wird nie dadurch aufgelöst, dass das Buch nachträglich
  schlechtgeredet wird.

begruendung:

  anforderungen: |
    Vier Dinge. Fehlt eines, ist die Begründung unbrauchbar.

    1. WAS DAS BUCH FÜR DIESE LESERIN TRÄGT ODER NICHT TRÄGT — in normalen
       Worten, OHNE die Namen der Achsen. Die Namen stehen in "trifft" und
       "fehlt" daneben (siehe ACHSEN). Statt "trifft Katz und Maus" heißt es
       "beide Seiten handeln"; der Satz verbindet Buch und Erwartung, die
       Marke darüber nennt die Achse.
    2. WORAN IM BUCH das festzumachen ist: die konkrete Figur, Konstellation
       oder Situation. Nicht das Etikett.
    3. WAS DEN STERN KOSTET, bei allem unter fünf. Ausdrücklich.
    4. LESBAR FÜR JEMANDEN, DER DAS BUCH NICHT KENNT. Die Begründung steht
       allein auf einer Seite; wer sie liest, hat den Klappentext nicht neben
       sich.

  # Die Begründung ist ein Protokoll zum Nachprüfen — aber eines, das gelesen
  # wird. Diese drei Regeln stehen hier, weil sie in echten Urteilen gerissen
  # wurden, nicht als Vorsichtsmaßnahme.
  form: |
    HÖCHSTENS DREI SÄTZE, und jeder sagt EINE Sache. Vier Beobachtungen mit
    Gedankenstrichen und Kommas aneinandergehängt sind kein Satz, sondern eine
    Liste ohne Aufzählungszeichen: bis zum Ende hat die Leserin den Anfang
    verloren.

    WER ETWAS AUS DEM BUCH NENNT, FÜHRT ES EIN. "nach dem Blitz" setzt voraus,
    dass jemand den Klappentext gelesen hat; "nach dem Blitzeinschlag, der den
    Strom im Hochhaus lahmlegt" setzt nichts voraus. Dasselbe gilt für Namen:
    beim ersten Mal steht dabei, wer das ist.

    KEIN VERFAHRENSDEUTSCH. Sätze über das Urteil statt über das Buch —
    "erschlossen, nicht belegt", "die Achse ist bedient", "das ist eingerechnet"
    — gehören nicht in den Text. Worauf das Urteil ruht, sagt die confidence
    daneben; was fehlt, wird als SACHE gesagt: "der Klappentext sagt nichts
    darüber, wie schnell erzählt wird".

  verboten:
    - untugend: Achsenname im Text
      beispiel: >-
        Trifft "Katz und Maus" wörtlich. → Der Name steht unter "trifft"; der
        Text sagt, woran man es sieht: "der Erpresser handelt selbst und setzt
        eine Frist".
    - untugend: Tatsache statt Grund
      beispiel: Band 1 einer Reihe um Margarete von Brühl.
    - untugend: Zirkelschluss
      beispiel: Trifft den Kern. / Passt gut zum Profil.
    - untugend: Genre-Etikett allein
      beispiel: Cyberpunk-Dystopie.
    - untugend: Verstecktes Nichtwissen
      beispiel: Zur Erzählweise kann ich nichts sagen. → stattdessen nachschlagen
    - untugend: Anspielung statt Angabe
      beispiel: >-
        Der Klappentext lässt offen, ob nach dem Blitz gedrängt oder ausgekostet
        wird. → Wer "den Blitz" nicht kennt, liest hier nichts.
    - untugend: Ein Satz, der nicht enden will
      beispiel: >-
        A ist genau die Figur, die das Profil verlangt, B erzwingt die
        Konstellation, und C bedient den Ton — der fünfte Stern fehlt bei D:
        … → drei Sätze daraus.

  # Illustration, gemessen an einem Profil, das eine tragende, beschädigte
  # Erzählstimme und enge Konstellationen verlangt. Der Inhalt gehört diesem
  # Beispiel, nicht diesem Dokument.
  beispiel: |
    1942 – Das Labor · Paul Schüler — 3 Sterne

    Eine Physikerin sabotiert die Uranmaschine, an der sie selbst gebaut hat,
    während die Gestapo ihr im Nacken sitzt: ein Duell mit tödlichem Einsatz,
    bei dem beide Seiten handeln — nur mit vertauschten Rollen, gejagt statt
    jagend. Zwei Sterne kostet, dass die Erzählstimme keine der Bruchstellen
    hat, die dieses Profil verlangt, und dass das historische Setting keine der
    engen Konstellationen aufbaut, aus denen die Handlung sonst ihren Druck
    bezieht.

    Der Unterschied zum Verbotenen: es steht da, WAS IM BUCH PASSIERT und
    WELCHE ERWARTUNG DES PROFILS das bedient — und der fehlende Stern ist
    begründet, nicht bloß vergeben.

achsen: |
  Neben der Begründung stehen zwei Listen: "trifft" und "fehlt". Sie nennen
  die Achsen des Leseprofils, die das Buch trifft und die es verfehlt — mit
  genau dem Namen, den die Achse im Leseprofil trägt, und keinem anderen.

  Drei Regeln, und der Code prüft jede. Verletzt eine Antwort eine davon,
  wird das ganze Urteil verworfen, und das Buch bleibt unbeurteilt:

  - Nur Namen, die es im Leseprofil gibt. Ein erfundener Name ist ein
    erfundener Bezug.
  - Fünf Sterne heißt: nichts fehlt. "fehlt" ist dann leer.
  - Ab drei Sternen trifft das Buch mindestens eine Achse. "trifft" ist dann
    nicht leer — wer drei Sterne gibt, weiß, wofür.

  Eine Achse, zu der der Klappentext nichts sagt, gehört in keine der beiden
  Listen. "fehlt" heißt: das Buch verfehlt sie, nicht: niemand weiß es.

  AUSSCHLÜSSE SIND KEINE ACHSEN. Der Einstieg und die Gegenanzeigen unter
  "genres" stehen in keiner der beiden Listen — auch nicht als "Einstieg"
  unter "fehlt". Sie wiegen nicht mit, sie schließen aus: ein Band mitten in
  einer Reihe, die nicht unter die Ausnahmen des Leseprofils fällt, oder ein
  Buch mit einer Gegenanzeige bekommt null Sterne, gleichgültig wie viel sonst
  stimmt. Die Begründung sagt, welcher Ausschluss greift und woran er zu
  erkennen ist.

pitch:

  laenge: ein bis zwei Sätze, höchstens 200 Zeichen
  # Dieselbe Zahl, maschinenlesbar: der Code prüft dagegen, statt sie ein
  # zweites Mal in Python zu tragen (#29).
  hoechstens_zeichen: 200

  # Die Regeln stehen bewusst als Anweisungen und nicht als Verbote: ein
  # ausgeschriebenes Gegenbeispiel pflanzt genau das Muster ein, das es
  # verhindern soll, und eine Wand aus "nicht" verschiebt die Aufmerksamkeit
  # auf das Falsche. Was hier verboten bleibt, ist kurz gehalten (#29).
  regeln: |
    Der Pitch ist der Satz, der die Leserin hinsehen lässt. Er steht in der
    Vorschlagsliste, auf der Startseite und in der Watchlist-Zeile — überall
    dort, wo sie überfliegt, und dort steht sonst nichts. Er ist also die
    einzige Prosa zu diesem Buch und darf sagen, wovon es handelt.

    ZWEI HÄLFTEN, BEIDE AM BUCH. Zuerst, was das Buch ist; dann die eine
    Beobachtung, die den Ausschlag gibt — was trägt, oder was im Weg steht.

    WÄHLE AUS, FASSE NICHT ZUSAMMEN. Ein Bild, an dem dieses Buch hängt, statt
    einer Inhaltsangabe: die Tunnel unter dem Geisterdorf, die läutende Glocke,
    der Anruf, der ihn zurückzwingt.

    SCHREIB IN DIE ZWEITE HÄLFTE, WAS IM BUCH ES AUSMACHT. "Erklärt Tuchmacher
    und Besucherbergwerk, bevor etwas passiert" ist eine Beobachtung, die sich
    nachprüfen lässt. Nenne dafür weder das Profil noch eines seiner Kriterien
    — die Sterne daneben sagen das Urteil bereits.

    DIE PROBE: Lies die zweite Hälfte, ohne das Buch zu kennen. Könnte
    derselbe Satz unter einem beliebigen anderen Buch stehen, ist er falsch
    und gehört ersetzt durch etwas, das nur zu diesem passt.

    VARIIERE DEN BAU. Die Beispiele unten zeigen zwei Fügungen; es gibt mehr.
    Zwanzig Pitches hintereinander mit demselben Gedankenstrich an derselben
    Stelle sind ein Formular, keine Sätze.

    ES GIBT IMMER EINEN PITCH, auch bei null Sternen — sonst steht auf der
    Seite eine Lücke statt einer Auskunft.

    Nüchtern bleiben: beschreiben ist nicht loben. Ein Pitch, der zu einem
    Stern klingt wie zu fünf, ist wertlos. Nichts erfinden, nichts spoilern,
    keine Sternzahl, keinen Achsennamen.

  # Zwei Beispiele, bewusst verschieden gebaut: eines mit Gedankenstrich,
  # eines mit zwei Sätzen. Gleich gebaute Vorbilder lehren die Form statt der
  # Sache — genau daran ist die vorige Fassung gescheitert (#29).
  gut: |
    Was trägt, am Buch gezeigt:
    "Ein Mann, der über Vermisste berichtet, weil er seinen Bruder verlor —
    und dann ein Anruf, der ihn dorthin zurückzwingt, wo es passierte."

    Was im Weg steht, ebenso am Buch gezeigt:
    "Heimatkundliche Dark Fantasy um eine Glocke, die von selbst läutet. Bis
    etwas geschieht, sind Tuchmacher und Besucherbergwerk abgehandelt."

  schlecht:
    - text: Ein packender Thriller, der von der ersten bis zur letzten Seite fesselt.
      warum: Klingt zu jedem Buch. Sagt nichts über dieses.
    - text: Trifft die Achse "Die Figur trägt alles" mit vier von fünf Sternen.
      warum: Das ist die Begründung, nicht der Pitch. Und beides steht daneben.

nichts_erfinden: |
  Ist unklar, was ein Buch trägt, wird NACHGESCHLAGEN, bevor bewertet wird —
  soweit die Lage das zulässt (siehe confidence). Unsicherheit zu etikettieren
  statt sie aufzulösen ist ein teurer Fehler.

  Was auch nach der Recherche offen bleibt, wird BENANNT und nicht in die
  Bewertung eingerechnet. Eine Begründung, die eine Lücke verschweigt, ist
  schlimmer als eine, die sie ausspricht: die erste sieht aus wie ein Ergebnis.

# Das Urteil aus Merkmalen (ADR 33, #46): wie der Code aus dem Steckbrief
# eines Buchs und dem Profil der Leserin die Übereinstimmung rechnet. Kein
# Modell liest diesen Abschnitt; er steht deshalb nicht in "fuer_den_bewerter".
# Die Werte sind Startwerte (Grill vom 23.09.2026, #44); sobald genug eigene
# Urteile vorliegen, werden sie gelernt statt gesetzt.
urteil_aus_merkmalen:
  # Jede Facette ist ein eigener Grund, das Buch zu mögen; die Gründe werden
  # als Noisy-OR verbunden und verstärken sich, ohne je 100 % zu erreichen.
  facette_ganz: 0.8
  facette_teilweise: 0.1
  # Nur das stärkste Gegengewicht zählt, und es zieht diesen Anteil ab.
  # Ablehnung wiegt beim Standardverfahren Rocchio etwa ein Fünftel der
  # Zustimmung.
  gegengewicht: 0.2
  # Ab welcher Übereinstimmung wie viele Sterne; darunter einer. Null Sterne
  # gibt es nur, wenn keine Facette berührt ist und ein Gegengewicht trifft.
  sterne_ab:
    5: 0.8
    4: 0.6
    3: 0.4
    2: 0.2
