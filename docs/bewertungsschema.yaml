# Das Bewertungsschema (ADR 33): die Zahlen, mit denen der Code aus dem
# Steckbrief eines Buchs und dem Profil der Leserin die Übereinstimmung rechnet.
#
# Früher standen hier auch die Anweisungen an das Sterne-Modell: was ein Stern
# bedeutet, wie eine Begründung aussehen muss, worauf ein Urteil ruhen darf.
# Das Modell vergibt seit ADR 33 nur noch Merkmale, das Urteil rechnet der Code,
# und die Anweisung dazu steht im Steckbrief-Prompt (portrait.py). Die alte
# Fassung liegt in der Git-Historie (vor #52).
#
# Nichts hier nennt einen Geschmack; die Datei gilt für jede Leserin gleich.

# Die Werte der Formüberdeckung (#79, docs/research/urteil-methode.md). Geeicht
# am Prüfstand vom 25./26.09.2026: 22 gemochte und 2 enttäuschende Bücher der
# Leserin, jedes ohne sich selbst gelernt, 5 Gegenproben und eine Stichprobe
# von 53 Funden. Die alte Rechnung (Noisy-OR über Facetten und Merkmale) liegt
# in der Git-Historie und als Nachbau in docs/research/prototyp/alte_rechnung.py.
urteil_formueberdeckung:
  # Wie stark ein Merkmal im Buch wiegt, nach dem Gewicht, das das Modell
  # vergibt (#62). Ohne Angabe: ein Steckbrief aus der Zeit davor.
  gewicht_im_buch:
    praegend: 1.0
    deutlich: 0.7
    rand: 0.4
    ohne_angabe: 0.7
  # Wie stark ein durchschnittliches enttäuschendes Buch gegenüber einem
  # durchschnittlichen gemochten wiegt (Rocchio, γ/β; die Literatur nennt 0,2
  # bis 0,33), gemittelt über die enttäuschenden Bücher. Das Stärkste je
  # Merkmal (MultiNeg, ablehnung_gemittelt: false) war an den synthetischen
  # Leserinnen instabil: je mehr enttäuschende Bücher, desto mehr gemeinsame
  # Familien lehnte ein einziges Buch voll ab, und die Ausbeute fiel mit
  # jedem bewerteten Buch (Methode, Abschnitt 13). An den eigenen Büchern der
  # Leserin liegen beide gleich auf.
  ablehnung_verhaeltnis: 0.33
  ablehnung_gemittelt: true
  # Was die Leserin selbst zu einem gelesenen Buch sagt, das der Steckbrief
  # nicht nennt (beim Schwarm *gemächlich*), wiegt wie ein prägendes Merkmal.
  grund_der_leserin: 1.0
  # Das Getippte ist der Startwert der Form; es wiegt so viel wie zwei Bücher.
  getipptes_wiegt_buecher: 2.0
  getippt: 0.4
  verstaerkt: 0.6
  gegengewicht: 0.4
  # Wie stark ein einzelnes Merkmal zu seiner Familie hin geglättet wird:
  # *episch angelegt* ist nicht *Weltenbau*, aber beide sind *große Welt*.
  merkmal_zur_familie: 1.0
  # Ein typisches Gemochtes zählt voll: skaliert wird auf dieses Quantil der
  # Vorlieben, nicht auf die stärkste.
  voll_ab_quantil: 0.75
  # Ein dünner Steckbrief strebt zum Grundwert, statt mit einem einzigen
  # gemochten Merkmal auf 100 % zu springen (Z6).
  glaettung: 4.0
  grundwert: 0.2
  # Die Erzählmuster als zweite Spinne: ein Buch trägt eins bis drei.
  glaettung_muster: 1.0
  muster_dafuer: 0.35
  muster_dagegen: 0.5
  # Eine Facette, die das Buch ganz trägt, gibt diesen Aufschlag.
  facette_ganz: 0.25
  # Ein Gegengewicht, das die Leserin auf ein Genre beschränkt hat, ist eine
  # Regel, keine Richtung der Form: im Genre zieht es so viel ab (mal dem
  # Gewicht des Merkmals im Buch).
  gegengewicht_mit_genre: 0.5
  # Ab wie vielen Sternen das Bewertungstor einen Fund durchlässt (ADR 19,
  # #48). Ein Fund ohne Urteil wird nie zurückgehalten.
  tor_ab_sternen: 3
  # Ab welcher Übereinstimmung wie viele Sterne; darunter einer.
  sterne_ab:
    5: 0.7
    4: 0.55
    3: 0.4
    2: 0.2
