# Das Bewertungsschema (ADR 33): die Zahlen, mit denen der Code aus dem
# Steckbrief eines Buchs und dem Profil der Leserin die Übereinstimmung rechnet.
#
# Früher standen hier auch die Anweisungen an das Sterne-Modell: was ein Stern
# bedeutet, wie eine Begründung aussehen muss, worauf ein Urteil ruhen darf.
# Das Modell vergibt seit ADR 33 nur noch Merkmale, das Urteil rechnet der Code,
# und die Anweisung dazu steht im Steckbrief-Prompt (portrait.py). Die alte
# Fassung liegt in der Git-Historie (vor #52).
#
# Nichts hier nennt einen Geschmack; die Datei gilt für jede Leserin gleich.

# Die Werte sind Startwerte (Grill vom 23.09.2026, #44); sobald genug eigene
# Urteile vorliegen, werden sie gelernt statt gesetzt.
urteil_aus_merkmalen:
  # Jeder Grund, das Buch zu mögen, zählt für sich; die Gründe werden als
  # Noisy-OR verbunden und verstärken sich, ohne je 100 % zu erreichen.
  #
  # Eine Facette — eine Kombination gemochter Merkmale, die mehrere geliebte
  # Bücher gemeinsam tragen — zählt, wenn das Buch sie ganz trägt.
  facette_ganz: 0.8
  # Jedes gemochte Merkmal, das das Buch trägt, zählt schwach für sich
  # (#64). 0,1 lässt jedes Urteil aus dem Versuch, wie es war; 0,15 hob
  # "von allem ein bisschen" auf 3 Sterne.
  merkmal_einzeln: 0.1
  # Was die Leserin verstärkt hat (höchstens drei), bekommt diesen Aufschlag
  # (24.09.2026): ein Merkmal 0,1 → 0,2, ein Erzählmuster 0,3 → 0,4. Ab 0,2
  # Aufschlag käme "brutal, aber flache Figur" durchs Tor.
  verstaerkt_aufschlag: 0.1
  # Ein gemochtes Erzählmuster ist ein eigener Grund, nie Teil einer
  # Facette (#63).
  erzaehlmuster: 0.3
  # Nur das stärkste Gegengewicht zählt, und es zieht diesen Anteil ab.
  # Ablehnung wiegt beim Standardverfahren Rocchio etwa ein Fünftel der
  # Zustimmung; an den eigenen Büchern war das zu wenig (24.09.2026): "Der
  # Schwarm", von der Leserin als enttäuschend genannt, kam mit 0,2 auf 47 %
  # und damit durchs Tor. Ab etwa 0,33 fällt er unter drei Sterne; 0,35 lässt
  # die gemochten Bücher unberührt. Mehrere Gegengewichte werden nicht
  # summiert: die aus einem Buch zählten es sonst mehrfach.
  gegengewicht: 0.35
  # Ab wie vielen Sternen das Bewertungstor einen Fund durchlässt (ADR 19,
  # #48). Ein beliebiges Buch erreicht drei Sterne zu etwa 27 %, vier nur zu
  # etwa 5 %; mit einer einzigen Facette hielte vier fast alles Neue zurück.
  # Ein Fund ohne Urteil wird nie zurückgehalten.
  tor_ab_sternen: 3
  # Ab welcher Übereinstimmung wie viele Sterne; darunter einer. Null Sterne
  # gibt es nur, wenn nichts Gemochtes getroffen ist und ein Gegengewicht trifft.
  sterne_ab:
    5: 0.8
    4: 0.6
    3: 0.4
    2: 0.2
