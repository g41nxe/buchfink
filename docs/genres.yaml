# Die feste Genre-Liste (ADR 37).
#
# Jeder Eintrag ist ein BISAC-Code (BISG) mit eigenem deutschem Namen. Die
# englische Bezeichnung steht nicht hier: Codes zu benutzen gibt BISG
# ausdrücklich frei, die Liste oder Teile davon weiterzugeben nicht (#119).
# Nachschlagen lässt sie sich je Code unter bisg.org/page/BISACSubjectCodes.
# Aufgenommen ist, was mindestens ein
# Buch im Bestand braucht (Zählung vom 04.10.2026); die Ordnung kommt aus
# BISAC, nicht aus dem Geschmack der Leserin. Das „General" einer Gruppe ist
# ihr „sonstiges".
#
# Die Liste kennt keine Quelle: jede Quelle übersetzt die Codes in ihrer eigenen
# Tabelle (`sources/*/selectors.py`, `GENRES`). Ein Name lässt sich hier
# ändern, der Code nicht — an ihm hängen Steckbriefe, Profil und Themen.
#
# `erweiterung: true` markiert, was BISAC nicht kennt; die Id beginnt dann mit
# `DE-`.

genres:
  - code: FIC031000
    name: Thriller
    untergenres:
      - {code: FIC031080, name: Psychothriller}
      - {code: FIC031100, name: Domestic Thriller}
      - {code: FIC031010, name: Crime-Thriller}
      - {code: FIC036000, name: Techno-Thriller}
      - {code: FIC006000, name: Spionage}
      - {code: FIC031070, name: Übernatürlicher Thriller}

  - code: FIC022000
    name: Krimi
    untergenres:
      - {code: FIC022020, name: Polizeikrimi}
      - {code: FIC022070, name: Cosy Crime}
      - {code: FIC022080, name: Internationaler Krimi}
      - {code: DE-REGIONALKRIMI, name: Regionalkrimi, erweiterung: true}

  - code: FIC028000
    name: Science-Fiction
    untergenres:
      - {code: FIC028030, name: Space Opera}
      - {code: FIC028070, name: Postapokalypse}
      - {code: FIC028050, name: Military SF}
      - {code: FIC028100, name: Cyberpunk}

  - code: FIC055000
    name: Dystopie

  - code: FIC009000
    name: Fantasy
    untergenres:
      - {code: FIC009020, name: High Fantasy}
      - {code: FIC009060, name: Urban Fantasy}
      - {code: FIC009070, name: Dark Fantasy}

  - code: FIC015000
    name: Horror
    untergenres:
      - {code: FIC015040, name: Übernatürlicher Horror}
      - {code: FIC015030, name: Kreaturenhorror}
      - {code: FIC015050, name: Psychologischer Horror}

  - code: FIC027000
    name: Liebesroman
    untergenres:
      - {code: FIC027020, name: Contemporary Romance}
      - {code: FIC027030, name: Romantasy}

  - code: FIC016000
    name: Humor
    untergenres:
      - {code: FIC060000, name: Schwarzer Humor}

  - code: FIC014000
    name: Historischer Roman

  - code: FIC019000
    name: Gegenwartsliteratur

  - code: FIC002000
    name: Abenteuer

  - code: BIO000000
    name: Biografie & Erinnerungen

  # Die Zielgruppe, nicht das Erzählgenre (29.10.2026): ein Kinderkrimi ist für
  # sie zuerst ein Kinderbuch. „Doktor Proktor“ kam über einen Autoren-Feed in
  # den Stapel, weil die Liste das Wort nicht kannte. Ein Code der Quelle unter
  # JUV oder YAF zählt als dieser Eintrag (`preferences.book_codes`).
  - code: JUV000000
    name: Kinderbuch

  - code: YAF000000
    name: Jugendbuch
